<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Codavatar InternTrack - Admin Activity</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="brand">
      Codavatar InternTrack <span class="badge">Admin</span>
      <span class="badge" id="who"></span>
    </div>
    <div class="row">
      <button class="secondary" onclick="window.location.href='admin.html'">Dashboard</button>
      <button class="secondary" onclick="window.location.href='admin_users.html'">Users</button>
      <button class="secondary" onclick="window.location.href='admin_assignments.html'">Assignments</button>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <h2>Activity Log</h2>

    <div class="row">
      <div class="field" style="flex:1;min-width:240px">
        <label>Search</label>
        <input id="q" placeholder="task_created, progress_updated, email, staff id..."
               oninput="debouncedLoad()"/>
      </div>
      <div class="field" style="width:200px">
        <label>Quick Filter</label>
        <select id="quick" onchange="applyQuick()">
          <option value="">All</option>
          <option value="task">Tasks</option>
          <option value="progress">Progress</option>
          <option value="attendance">Attendance</option>
          <option value="report">Reports</option>
          <option value="complaint">Complaints</option>
          <option value="auth">Auth</option>
        </select>
      </div>
      <div class="field" style="width:160px">
        <label>Limit</label>
        <select id="limit" onchange="loadLogs()">
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>
    </div>

    <div id="logs" class="muted">Loading...</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
const u = requireAuth();
document.getElementById("who").textContent = `${u.email} | ${u.staff_id||""}`;

let _t = null;
function debouncedLoad(){
  clearTimeout(_t);
  _t = setTimeout(loadLogs, 250);
}

function applyQuick(){
  const v = document.getElementById("quick").value;
  const q = document.getElementById("q");

  const map = {
    task: "task",
    progress: "progress",
    attendance: "attendance",
    report: "report",
    complaint: "complaint",
    auth: "login signup verify token"
  };

  q.value = map[v] || "";
  loadLogs();
}

function safe(s){ return (s ?? "").toString().replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

async function loadLogs(){
  const q = document.getElementById("q").value.trim();
  const limit = document.getElementById("limit").value;

  const url = `${API_BASE}/admin/activity/?q=${encodeURIComponent(q)}&limit=${encodeURIComponent(limit)}`;
  const res = await apiFetch(url);
  const data = await res.json().catch(()=>[]);
  const box = document.getElementById("logs");

  if(!res.ok){
    box.textContent = "Failed to load activity. (Backend endpoint: /api/admin/activity/ missing?)";
    return;
  }

  if(!Array.isArray(data) || !data.length){
    box.textContent = "No activity yet.";
    return;
  }

  box.innerHTML = `
    <table class="table">
      <thead>
        <tr>
          <th style="width:170px">Time</th>
          <th>Actor</th>
          <th>Action</th>
          <th>Entity</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody>
        ${data.map(a=>`
          <tr>
            <td class="small">${a.created_at ? new Date(a.created_at).toLocaleString() : ""}</td>
            <td>
              <b>${safe(a.actor?.staff_id || "System")}</b>
              <div class="muted small">${safe(a.actor?.email || "")} ${a.actor?.role ? "(" + safe(a.actor.role) + ")" : ""}</div>
            </td>
            <td><b>${safe(a.action || "")}</b></td>
            <td class="small">${safe(a.entity || "")} ${a.entity_id ? "#" + safe(a.entity_id) : ""}</td>
            <td>${safe(a.message || "")}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

loadLogs();
</script>
</body>
</html>
