<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Codavatar InternTrack - Supervisor</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="container">

  <div class="topbar">
    <div class="brand">
       <img src="img/logo.png" alt="Codavatar Logo" style="height:60px;display:block;margin:0 auto 10px;"/>
      Codavatar InternTrack <span class="badge">Supervisor</span>
      <span class="badge" id="who"></span>
    </div>
    <div class="row">
      <button class="secondary" onclick="showTab('interns')">Interns</button>
      <button class="secondary" onclick="showTab('assign')">Assign Task</button>
      <button class="secondary" onclick="showTab('tasks')">My Tasks</button>
      <button class="secondary" onclick="showTab('complaints')">Complaints</button>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- TABS -->
  <div id="tab_interns" class="card" style="margin-top:16px;">
    <h2>My Interns</h2>
    <div class="row" style="margin-bottom:10px;">
      <input id="intern_q" placeholder="Search interns..." oninput="loadInterns()" style="flex:1;min-width:260px"/>
      <button class="secondary" onclick="loadInterns()">Refresh</button>
    </div>
    <div id="intern_list" class="muted">Loading...</div>
  </div>

  <div id="tab_assign" class="card" style="margin-top:16px; display:none;">
    <h2>Assign Task</h2>

    <div class="field">
      <label>Intern</label>
      <select id="task_intern"></select>
    </div>
    <div class="field">
      <label>Title</label>
      <input id="task_title" placeholder="Task title"/>
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="task_desc" rows="4" placeholder="Task description"></textarea>
    </div>
    <div class="field">
      <label>Due Date</label>
      <input id="task_due" type="date"/>
    </div>

    <button onclick="createTask()">Assign</button>
    <p id="task_msg" class="muted"></p>
  </div>

  <div id="tab_tasks" class="card" style="margin-top:16px; display:none;">
    <h2>Tasks I Assigned</h2>
    <div class="row" style="margin-bottom:10px;">
      <button class="secondary" onclick="loadTasks()">Refresh</button>
    </div>
    <div id="task_list" class="muted">Loading...</div>
  </div>

  <div id="tab_complaints" class="card" style="margin-top:16px; display:none;">
    <h2>Complaints (My Interns)</h2>
    <div class="row" style="margin-bottom:10px;">
      <button class="secondary" onclick="loadComplaints()">Refresh</button>
    </div>
    <div id="complaint_list" class="muted">Loading...</div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/supervisor.js"></script>
</body>
</html>
