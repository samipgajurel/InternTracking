<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin – Users</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="brand">
       <img src="img/logo.png" alt="Codavatar Logo" style="height:60px;display:block;margin:0 auto 10px;"/>
      Codavatar InternTrack <span class="badge">Admin</span>
      <span class="badge" id="who"></span>
    </div>
    <div class="row">
      <button class="secondary" onclick="window.location.href='admin.html'">Dashboard</button>
      <button class="secondary" onclick="window.location.href='admin_assignments.html'">Assignments</button>
      <button class="secondary" onclick="window.location.href='admin_activity.html'">Activity</button>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="grid">
    <!-- Create user -->
    <div class="card">
      <h2>Create User</h2>

      <div class="field"><label>Full name</label><input id="full_name" placeholder="e.g. John Doe"/></div>
      <div class="field"><label>Email</label><input id="email" placeholder="e.g. john@example.com"/></div>
      <div class="field"><label>Password</label><input id="password" type="password" placeholder="min 6 chars"/></div>

      <div class="field">
        <label>Role</label>
        <!-- ✅ backend allows ONLY supervisor/intern -->
        <select id="role">
          <option value="supervisor">Supervisor</option>
          <option value="intern">Intern</option>
        </select>
      </div>

      <button onclick="createUser()">Create</button>
      <p id="msg" class="muted"></p>

      <hr/>
      <p class="muted small">
        Admin accounts should be created from Django admin panel (recommended).
      </p>
    </div>

    <!-- User list -->
    <div class="card">
      <h2>All Users</h2>

      <div class="row">
        <div class="field" style="flex:1;min-width:220px">
          <label>Search</label>
          <input id="q" placeholder="Search name/email/staff id..." oninput="debouncedLoad()"/>
        </div>

        <div class="field" style="width:200px">
          <label>Filter Role</label>
          <select id="roleFilter" onchange="loadUsers()">
            <option value="">All</option>
            <option value="supervisor">Supervisors</option>
            <option value="intern">Interns</option>
            <option value="admin">Admins</option>
          </select>
        </div>
      </div>

      <div id="users" class="muted">Loading...</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
const me = requireAuth();
document.getElementById("who").textContent = `${me.email} | ${me.staff_id || ""}`;

// ✅ accounts endpoints
const ACCOUNTS_BASE = `${API_BASE}/accounts`;

let _t = null;
function debouncedLoad(){
  clearTimeout(_t);
  _t = setTimeout(loadUsers, 250);
}

function esc(s){
  return (s ?? "").toString().replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
}

async function createUser(){
  const msg = document.getElementById("msg");
  msg.textContent = "Creating...";

  const body = {
    full_name: document.getElementById("full_name").value.trim(),
    email: document.getElementById("email").value.trim().toLowerCase(),
    password: document.getElementById("password").value,
    role: document.getElementById("role").value
  };

  const res = await apiFetch(`${ACCOUNTS_BASE}/admin/create-user/`, {
    method: "POST",
    body: JSON.stringify(body)
  });

  const data = await res.json().catch(()=>({}));

  if(!res.ok){
    msg.textContent = data.detail || "Failed";
    return;
  }

  msg.textContent = "✅ Created";
  document.getElementById("password").value = "";
  loadUsers();
}

async function loadUsers(){
  const box = document.getElementById("users");
  box.textContent = "Loading...";

  const q = document.getElementById("q").value.trim().toLowerCase();
  const roleFilter = document.getElementById("roleFilter").value;

  // ✅ This endpoint returns all users with role (after our backend fix)
  const res = await apiFetch(`${ACCOUNTS_BASE}/admin/users/`);
  const data = await res.json().catch(()=>[]);

  if(!res.ok){
    box.textContent = data.detail || "Failed to load users.";
    return;
  }

  let users = Array.isArray(data) ? data : [];

  // role filter (client-side)
  if(roleFilter){
    users = users.filter(u => (u.role || "").toLowerCase() === roleFilter);
  }

  // search filter
  if(q){
    users = users.filter(u => {
      const hay = `${u.full_name||""} ${u.email||""} ${u.staff_id||""}`.toLowerCase();
      return hay.includes(q);
    });
  }

  if(!users.length){
    box.innerHTML = `<div class="muted">No users found.</div>`;
    return;
  }

  box.innerHTML = `
    <div class="muted small" style="margin-bottom:10px">
      Showing <b>${users.length}</b> user(s)
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Staff ID</th>
          <th>Verified</th>
        </tr>
      </thead>
      <tbody>
        ${users.map(u => `
          <tr>
            <td><b>${esc(u.full_name)}</b></td>
            <td>${esc(u.email)}</td>
            <td><span class="badge">${esc(u.role)}</span></td>
            <td>${esc(u.staff_id || "-")}</td>
            <td>${u.is_verified ? "✅" : "—"}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

loadUsers();
</script>
</body>
</html>
