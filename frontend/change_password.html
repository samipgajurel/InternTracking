<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Change Password - InternTrack</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="brand">
      Codavatar InternTrack <span class="badge">Account</span>
      <span class="badge" id="who"></span>
    </div>
    <div class="row">
      <button class="secondary" onclick="goBack()">Back</button>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="grid">
    <div class="card" style="max-width:620px;margin:auto;">
      <h2>Change Password</h2>
      <p class="muted small" style="margin-top:-6px">
        After changing password, you will be logged out and must login again.
      </p>

      <div class="field">
        <label>Current Password</label>
        <div class="row" style="gap:8px;align-items:center">
          <input id="current_password" type="password" placeholder="Current password" style="flex:1" />
          <button class="secondary" type="button" onclick="togglePw('current_password')">👁</button>
        </div>
      </div>

      <div class="field">
        <label>New Password</label>
        <div class="row" style="gap:8px;align-items:center">
          <input id="new_password" type="password" placeholder="New password" style="flex:1" />
          <button class="secondary" type="button" onclick="togglePw('new_password')">👁</button>
        </div>

        <!-- strength meter -->
        <div style="margin-top:10px">
          <div class="muted small">Password strength</div>
          <div style="height:10px;background:#eee;border-radius:8px;overflow:hidden">
            <div id="pwBar" style="height:10px;width:0%"></div>
          </div>
          <div id="pwText" class="muted small" style="margin-top:6px"></div>
        </div>
      </div>

      <div class="field">
        <label>Confirm New Password</label>
        <div class="row" style="gap:8px;align-items:center">
          <input id="confirm_password" type="password" placeholder="Confirm new password" style="flex:1" />
          <button class="secondary" type="button" onclick="togglePw('confirm_password')">👁</button>
        </div>
      </div>

      <button onclick="changePassword()">Update Password</button>
      <p id="msg" class="muted" style="margin-top:10px"></p>

      <hr/>
      <p class="muted small">
        Tip: Use at least 8 characters with uppercase, lowercase, number, and symbol.
      </p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/change_password.js"></script>
</body>
</html>
