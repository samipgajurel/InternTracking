<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reset Password</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="brand">Codavatar InternTrack</div>
  </div>

  <div class="grid">
    <div class="card" style="max-width:520px;margin:auto;">
      <h2>Reset Password</h2>

      <div class="field">
        <label>New Password</label>
        <div class="row" style="gap:8px;align-items:center">
          <input id="new_password" type="password" placeholder="New password" style="flex:1"/>
          <button class="secondary" type="button" onclick="toggleNew()">👁</button>
        </div>

        <div style="margin-top:10px">
          <div class="muted small">Password strength</div>
          <div style="height:10px;background:#eee;border-radius:8px;overflow:hidden">
            <div id="pwBar" style="height:10px;width:0%"></div>
          </div>
          <div id="pwText" class="muted small" style="margin-top:6px"></div>
        </div>
      </div>

      <button onclick="resetPassword()">Reset</button>
      <p id="msg" class="muted"></p>

      <p class="muted small" style="margin-top:12px">
        <a href="login.html">Back to login</a>
      </p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/reset_password.js"></script>
</body>
</html>
