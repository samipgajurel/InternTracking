<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Codavatar InternTrack - Admin</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
<div class="container">
  <div class="topbar">
    <div class="brand">
      <img src="img/logo.png" alt="Codavatar Logo" style="height:60px;display:block;margin:0 auto 10px;"/>
      Codavatar InternTrack <span class="badge">Admin</span>
      <span class="badge" id="who"></span>
    </div>
    <div class="row">
      <button class="secondary" onclick="window.location.href='admin_users.html'">Users</button>
      <button class="secondary" onclick="window.location.href='admin_assignments.html'">Assignments</button>
      <button class="secondary" onclick="window.location.href='admin_activity.html'">Activity</button>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="grid" style="margin-top:18px">
    <div class="card">
      <h2>Overview</h2>
      <div id="totals" class="muted">Loading...</div>
      <hr/>
      <div class="row">
        <button class="secondary" onclick="refreshAll()">Refresh</button>
        <button class="secondary" onclick="window.location.href='admin_assignments.html'">Assign Interns</button>
      </div>
    </div>

    <div class="card">
      <h2>Performance (Last 1 Month)</h2>
      <canvas id="chart" height="120"></canvas>

      <!-- ✅ Value-based legend (works with your CSS) -->
      <p class="task-legend">
        <span class="legend-item">
          <span class="legend-dot blue"></span>
          <span>1 Task</span>
        </span>

        <span class="legend-item">
          <span class="legend-dot green"></span>
          <span>2 Tasks</span>
        </span>

        <span class="legend-item">
          <span class="legend-dot orange"></span>
          <span>3+ Tasks</span>
        </span>
      </p>

      <p class="muted small" style="margin-top:10px">
        Tasks Created vs Tasks Done (last 1 month).
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
const user = requireAuth();
document.getElementById("who").textContent = `${user.email} | ${user.staff_id || ""}`;

let mainChart = null;

// ✅ correct accounts base
const ACCOUNTS_BASE = `${API_BASE}/accounts`;

/* 🎨 VALUE-BASED COLOR LOGIC (1=blue, 2=green, 3+=orange, 0=grey) */
function colorByValue(value) {
  value = Number(value || 0);
  if (value === 1) return "rgba(54, 162, 235, 0.85)";   // 🔵 1
  if (value === 2) return "rgba(75, 192, 192, 0.85)";   // 🟢 2
  if (value >= 3) return "rgba(255, 159, 64, 0.85)";    // 🟠 3+
  return "rgba(201, 203, 207, 0.85)";                   // 0
}

/* 👥 fallback user counts */
async function getUserCountsFallback(){
  // Try: /api/accounts/admin/users/ (all users)
  let res = await apiFetch(`${ACCOUNTS_BASE}/admin/users/`);
  let users = await res.json().catch(()=>[]);

  if(res.ok && Array.isArray(users)){
    return {
      supervisors: users.filter(u => (u.role||"").toLowerCase() === "supervisor").length,
      interns: users.filter(u => (u.role||"").toLowerCase() === "intern").length,
    };
  }

  // If backend still requires ?role=..., do 2 calls
  const supRes = await apiFetch(`${ACCOUNTS_BASE}/admin/users/?role=supervisor`);
  const sup = await supRes.json().catch(()=>[]);
  const intRes = await apiFetch(`${ACCOUNTS_BASE}/admin/users/?role=intern`);
  const interns = await intRes.json().catch(()=>[]);

  return {
    supervisors: (supRes.ok && Array.isArray(sup)) ? sup.length : 0,
    interns: (intRes.ok && Array.isArray(interns)) ? interns.length : 0,
  };
}

async function loadAnalytics(){
  const totalsBox = document.getElementById("totals");

  // ✅ internships analytics endpoint
  const res = await apiFetch(`${API_BASE}/admin/analytics/`);
  const data = await res.json().catch(()=>({}));

  if(!res.ok){
    totalsBox.textContent = "Failed to load analytics.";
    return;
  }

  const t = data.totals || {};

  // supervisors/interns from backend OR fallback
  let supervisorsCount = t.supervisors;
  let internsCount = t.interns;

  if (supervisorsCount == null || internsCount == null){
    const fallback = await getUserCountsFallback();
    supervisorsCount = supervisorsCount ?? fallback.supervisors;
    internsCount = internsCount ?? fallback.interns;
  }

  totalsBox.innerHTML = `
    <div class="muted">Supervisors: <b>${supervisorsCount ?? 0}</b></div>
    <div class="muted">Interns: <b>${internsCount ?? 0}</b></div>
    <hr/>
    <div class="muted">Total Tasks: <b>${t.tasks ?? 0}</b></div>
    <div class="muted">Tasks Done: <b>${t.tasks_done ?? 0}</b></div>
    <div class="muted">Completion Rate: <b>${t.completion_rate ?? 0}%</b></div>
  `;

  // ✅ Last 1 month only
  const months = (data.months || []).slice(-1);
  const s = data.series || {};

  const tasksCreated = (s.tasks_created || []).slice(-1);
  const tasksDone = (s.tasks_done || []).slice(-1);

  const labels = months.length ? months : ["Last Month"];

  const createdData = tasksCreated.length ? tasksCreated : [0];
  const doneData = tasksDone.length ? tasksDone : [0];

  // ✅ FORCE value-based colors per bar (this fixes your graph not changing)
  const createdColors = createdData.map(v => colorByValue(v));
  const doneColors = doneData.map(v => colorByValue(v));

  if(mainChart) mainChart.destroy();

  mainChart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels: labels,
      datasets: [
        {
          label: "Tasks Created",
          data: createdData,
          backgroundColor: createdColors,
          borderColor: createdColors,
          borderWidth: 1
        },
        {
          label: "Tasks Done",
          data: doneData,
          backgroundColor: doneColors,
          borderColor: doneColors,
          borderWidth: 1
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        // 🚫 Hide dataset legend because bar colors represent VALUES, not datasets
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              // ✅ robust across chart.js versions
              const value = (ctx.parsed && typeof ctx.parsed.y !== "undefined")
                ? ctx.parsed.y
                : ctx.raw;

              let meaning = "No Tasks";
              if (value === 1) meaning = "1 Task";
              else if (value === 2) meaning = "2 Tasks";
              else if (value >= 3) meaning = "3+ Tasks";

              return `${ctx.dataset.label}: ${value} (${meaning})`;
            }
          }
        }
      },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0 } }
      }
    }
  });
}

function refreshAll(){
  loadAnalytics();
}

loadAnalytics();
</script>
</body>
</html>
